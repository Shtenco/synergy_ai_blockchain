name: economic-os-testnet-v1

on:
  pull_request:
    paths:
      - 'registry/economic_testnet_genesis_v1.json'
      - 'testnet/economic_testnet_v1.py'
      - 'tests/test_economic_testnet_v1.py'
      - 'docs/ECONOMIC_OS_TESTNET_V1_20260828.md'
      - '.github/workflows/economic-os-testnet-v1.yml'
  workflow_dispatch:

jobs:
  protocol-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: pytest -q tests/test_economic_os_e2e_commitment_v1.py tests/test_economic_testnet_v1.py
