name: P8 portable Rust gates

on:
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/p8-portable-rust.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-p8:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: check
        run: cargo check --locked --all-targets
      - name: test default
        run: cargo test --locked --all-targets
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: test reference-pq
        run: cargo test --locked --all-targets --features reference-pq
