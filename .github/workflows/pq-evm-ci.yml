name: PQ-EVM consensus core

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: m2-pq-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: M2 static security guard
        run: python3 scripts/m2_static_guard.py

      - name: Pin MSRV toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal
          rustup component add rustfmt clippy --toolchain 1.85.0
          rustup override set 1.85.0
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version
          python3 --version

      - name: Resolve reproducibility bootstrap
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f Cargo.lock ]]; then
            echo "Using committed Cargo.lock"
          else
            echo "::warning::Cargo.lock is absent; generating bootstrap lockfile. M2 cannot become GREEN until this exact lockfile is committed and a later run succeeds with it."
            cargo generate-lockfile
          fi
          cargo metadata --locked --format-version 1 > m2-cargo-metadata-core.json
          cargo metadata --locked --format-version 1 --features reference-pq > m2-cargo-metadata-reference-pq.json
          python3 scripts/m2_verify_lock.py Cargo.lock m2-cargo-metadata-reference-pq.json
          cargo tree --locked --edges normal,build,dev > m2-cargo-tree-core.txt
          cargo tree --locked --edges normal,build,dev --features reference-pq > m2-cargo-tree-reference-pq.txt
          cargo tree --locked --duplicates --features reference-pq > m2-cargo-duplicates-reference-pq.txt
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python3 scripts/m2_spdx_from_cargo_metadata.py \
            m2-cargo-metadata-core.json \
            m2-spdx-core.json
          python3 scripts/m2_spdx_from_cargo_metadata.py \
            m2-cargo-metadata-reference-pq.json \
            m2-spdx-reference-pq.json

          {
            echo "git_commit=$(git rev-parse HEAD)"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "rustfmt=$(rustfmt --version)"
            echo "clippy=$(cargo clippy --version)"
            echo "python=$(python3 --version 2>&1)"
          } > m2-build-environment.txt

          sha256sum \
            Cargo.lock \
            m2-cargo-metadata-core.json \
            m2-cargo-metadata-reference-pq.json \
            m2-cargo-tree-core.txt \
            m2-cargo-tree-reference-pq.txt \
            m2-cargo-duplicates-reference-pq.txt \
            m2-spdx-core.json \
            m2-spdx-reference-pq.json \
            m2-build-environment.txt \
            > m2-evidence-sha256.txt

      - name: Formatting gate
        run: cargo fmt --all -- --check

      - name: Core compile gate
        run: cargo check --locked --all-targets

      - name: Reference PQ compile gate
        run: cargo check --locked --all-targets --features reference-pq

      - name: Reference PQ clippy gate
        run: cargo clippy --locked --all-targets --features reference-pq -- -D warnings -D clippy::all

      - name: Core unit tests
        run: cargo test --locked --all-targets

      - name: Real PQ reference provider tests
        run: cargo test --locked --all-targets --features reference-pq

      - name: Reference PQ doctests
        run: cargo test --locked --doc --features reference-pq

      - name: Release-mode PQ library tests
        run: cargo test --locked --release --lib --features reference-pq

      - name: Upload M2 reproducibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m2-cargo-reproducibility-${{ github.run_id }}
          path: |
            Cargo.lock
            m2-cargo-metadata-core.json
            m2-cargo-metadata-reference-pq.json
            m2-cargo-tree-core.txt
            m2-cargo-tree-reference-pq.txt
            m2-cargo-duplicates-reference-pq.txt
            m2-spdx-core.json
            m2-spdx-reference-pq.json
            m2-build-environment.txt
            m2-evidence-sha256.txt
          if-no-files-found: warn
          retention-days: 30
