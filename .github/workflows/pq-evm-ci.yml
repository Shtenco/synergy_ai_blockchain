name: PQ-EVM consensus core

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustc --version
          cargo --version
      - name: Core unit tests
        run: cargo test --all-targets
      - name: Real PQ reference provider tests
        run: cargo test --all-targets --features reference-pq
