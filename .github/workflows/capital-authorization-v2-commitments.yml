name: capital-authorization-v2-commitments

on:
  pull_request:
    paths:
      - 'sinergy_ai_blockchain/schema_policy.py'
      - 'fixtures/conformance/capital_authorization_v2_canonical.json'
      - 'fixtures/conformance/economic_cycle_trace_v2_complete.json'
      - 'tests/test_capital_authorization_v2_commitment_policy.py'
      - 'docs/CAPITAL_AUTHORIZATION_V2_COMMITMENT_POLICY_20260818.md'
      - '.github/workflows/capital-authorization-v2-commitments.yml'
  workflow_dispatch:

concurrency:
  group: capital-authorization-v2-commitments-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typed-v2:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Compile trust policy
        run: python -m py_compile sinergy_ai_blockchain/schema_policy.py
      - name: Run v1/v2 typed commitment regressions
        run: >-
          python -m pytest
          tests/test_schema_policy.py
          tests/test_capital_authorization_v2_commitment_policy.py
          -q
