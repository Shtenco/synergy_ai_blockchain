name: commitment-v3-federation-policy

on:
  pull_request:
    paths:
      - 'sinergy_ai_blockchain/v3/**'
      - 'schemas/commitment_envelope_v3.schema.json'
      - 'fixtures/conformance/settlement_receipt_v2_*.json'
      - 'fixtures/conformance/economic_cycle_trace_v3_complete.json'
      - 'tests/test_commitment_v3_federation_policy.py'
      - 'docs/COMMITMENT_V3_FEDERATION_POLICY_20260818.md'
      - '.github/workflows/commitment-v3-federation-policy.yml'
  workflow_dispatch:

concurrency:
  group: commitment-v3-federation-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitment-v3:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tests
        run: python -m pip install --upgrade pip pytest jsonschema
      - name: Compile v3 primitives
        run: >-
          python -m py_compile
          sinergy_ai_blockchain/v3/schema_policy.py
          sinergy_ai_blockchain/v3/commitment.py
      - name: Run policy and exact-byte regressions
        run: python -m pytest tests/test_commitment_v3_federation_policy.py -q
