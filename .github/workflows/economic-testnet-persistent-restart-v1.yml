name: economic-testnet-persistent-restart-v1

on:
  pull_request:
    paths:
      - 'testnet/economic_testnet_persistent_restart_v1.py'
      - 'registry/economic_testnet_persistent_restart_execution_evidence_v1.json'
      - 'tests/test_economic_testnet_persistent_restart_v1.py'
      - 'docs/ECONOMIC_TESTNET_PERSISTENT_RESTART_EVIDENCE_V1_20260828.md'
      - '.github/workflows/economic-testnet-persistent-restart-v1.yml'
  workflow_dispatch:

jobs:
  persistent-restart-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: pytest -q tests/test_economic_testnet_v1.py tests/test_economic_testnet_execution_evidence_v1.py tests/test_economic_testnet_loopback_v1.py tests/test_economic_testnet_persistent_restart_v1.py
