name: Portable Rust gates

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-portable:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo check
        run: cargo check --all-targets
      - name: cargo test default
        run: cargo test --all-targets
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test reference-pq
        run: cargo test --all-targets --features reference-pq
