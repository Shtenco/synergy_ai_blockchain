name: capital-cycle-commitment-domains

on:
  pull_request:
    paths:
      - 'sinergy_ai_blockchain/schema_policy.py'
      - 'fixtures/conformance/capital_authorization_v1_canonical.json'
      - 'tests/test_capital_cycle_commitment_policy.py'
      - 'docs/CAPITAL_AND_CYCLE_COMMITMENT_DOMAINS_20260818.md'
      - '.github/workflows/capital-cycle-commitment-domains.yml'
  workflow_dispatch:

concurrency:
  group: capital-cycle-commitment-domains-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typed-domains:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Compile policy and trust v2
        run: >-
          python -m py_compile
          sinergy_ai_blockchain/schema_policy.py
          sinergy_ai_blockchain/v2/canonical_json.py
          sinergy_ai_blockchain/v2/commitment.py
      - name: Run typed-domain regressions
        run: >-
          python -m pytest
          tests/test_schema_policy.py
          tests/test_commitment_v2.py
          tests/test_capital_cycle_commitment_policy.py
          -q
