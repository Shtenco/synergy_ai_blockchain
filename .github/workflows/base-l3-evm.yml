name: Base-L3 Foundry EVM

on:
  push:
    branches:
      - base-l3-cross-domain-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract package
        shell: bash
        run: |
          set -euo pipefail
          base64 -d ci/SYNERGY_BASE_L3_CROSS_DOMAIN_ARBITRAGE_V2.tar.gz.b64 > /tmp/pkg.tar.gz
          tar -xzf /tmp/pkg.tar.gz
          test -f SYNERGY_BASE_L3_CROSS_DOMAIN_ARBITRAGE/foundry.toml

      - name: Install Foundry v1.8.1 without third-party action
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.foundry/bin"
          curl -fsSL --retry 3 \
            https://github.com/foundry-rs/foundry/releases/download/v1.8.1/foundry_v1.8.1_linux_amd64.tar.gz \
            -o /tmp/foundry.tar.gz
          echo '37b45855232e57624d90113b049ca54f0c92055bb5c1997fcbdc3076c7b89c10  /tmp/foundry.tar.gz' | sha256sum -c -
          tar -xzf /tmp/foundry.tar.gz -C "$HOME/.foundry/bin"
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"

      - name: Tool versions
        shell: bash
        run: |
          forge --version
          cast --version
          anvil --version

      - name: Static and economic controls
        working-directory: SYNERGY_BASE_L3_CROSS_DOMAIN_ARBITRAGE
        shell: bash
        run: |
          python3 scripts/static_audit.py
          python3 scripts/economic_reference.py

      - name: Solidity build
        working-directory: SYNERGY_BASE_L3_CROSS_DOMAIN_ARBITRAGE
        shell: bash
        run: forge build --sizes

      - name: EVM tests
        working-directory: SYNERGY_BASE_L3_CROSS_DOMAIN_ARBITRAGE
        shell: bash
        run: forge test -vvv
