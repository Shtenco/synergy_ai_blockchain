name: commitment-v5-accounting-close-trace-v6

on:
  pull_request:
    paths:
      - 'sinergy_ai_blockchain/v5/**'
      - 'schemas/commitment_envelope_v5.schema.json'
      - 'fixtures/conformance/ledger_event_v2_recognized_revenue.json'
      - 'fixtures/conformance/accounting_close_v2_cycle_003.json'
      - 'fixtures/conformance/ledger_inclusion_proof_v2_cycle_003.json'
      - 'fixtures/conformance/economic_cycle_trace_v6_complete.json'
      - 'fixtures/conformance/commitment_envelope_v5_trace_v6.json'
      - 'tests/test_commitment_v5_accounting_close_trace_v6.py'
      - '.github/workflows/commitment-v5-accounting-close-trace-v6.yml'
  workflow_dispatch:

concurrency:
  group: commitment-v5-accounting-close-trace-v6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trust-v5:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest jsonschema
      - name: Compile v5 trust generation
        run: >-
          python -m py_compile
          sinergy_ai_blockchain/v5/schema_policy.py
          sinergy_ai_blockchain/v5/commitment.py
      - name: Run v5 trust regressions
        run: python -m pytest tests/test_commitment_v5_accounting_close_trace_v6.py -q
