[package]
name = "synergy-pq-evm-core"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Consensus-safe post-quantum EVM extension with deterministic NEXUS and world-compute service-plane commitments"

[lib]
name = "synergy_pq_evm_core"
path = "src/lib_v2.rs"

[features]
default = []
reference-pq = [
    "dep:ml-kem",
    "dep:ml-dsa",
    "dep:slh-dsa",
    "dep:fips205",
    "dep:rand",
    "dep:signature",
]

[dependencies]
zeroize = { version = "=1.8.1", default-features = false, features = ["alloc"] }
sha2 = { version = "=0.10.9", default-features = false }
hkdf = { version = "=0.12.4", default-features = false }
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
blst = { version = "=0.3.17", default-features = false }
ml-kem = { version = "=0.3.2", optional = true, default-features = false, features = ["getrandom", "zeroize"] }
ml-dsa = { version = "=0.1.1", optional = true, default-features = false, features = ["alloc", "getrandom", "zeroize"] }
slh-dsa = { version = "=0.1.0", optional = true, default-features = false, features = ["alloc"] }
fips205 = { version = "=0.4.1", optional = true, default-features = false, features = ["default-rng", "slh_dsa_shake_256s"] }
rand = { version = "=0.8.5", optional = true, default-features = false, features = ["getrandom", "std", "std_rng"] }
signature = { version = "=2.3.0-pre.4", optional = true, default-features = false, features = ["rand_core"] }

[dev-dependencies]
hex = "=0.4.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"


[profile.release]
overflow-checks = true

# Optimize the test profile while explicitly preserving debug assertions
# and overflow checks. This keeps the exact same tests/coverage but makes
# SLH-DSA/FIPS cryptography practical on older CPUs.
[profile.test]
opt-level = 3
debug-assertions = true
overflow-checks = true
